version: 2

models:
  - name: stg_deal_ledger__entities
    columns:
      - name: entity_id
        data_tests: [unique, not_null]
      - name: hierarchy_level
        data_tests:
          - accepted_values:
              arguments: {values: ["holding group", "member entity", "independent"]}
      - name: dl_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["Anchor", "Scale", "Standard", "Starter"]}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ["Active", "Departed", "Pipeline"]}
      - name: billing_channel
        data_tests:
          - accepted_values:
              arguments: {values: ["billing core", "direct-checkout book", "partner biller", "none"]}
      - name: holding_entity_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}
      - name: successor_entity_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}

  - name: stg_deal_ledger__status_history
    columns:
      - name: history_id
        data_tests: [unique, not_null]
      - name: entity_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}
      - name: to_status
        data_tests:
          - accepted_values:
              arguments: {values: ["Active", "Departed", "Pipeline"]}
      - name: changed_local_date
        data_tests: [not_null]

  - name: stg_deal_ledger__contracts
    columns:
      - name: contract_id
        data_tests: [unique, not_null]
      - name: entity_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}

  - name: stg_billing_core__customers
    columns:
      - name: billing_customer_id
        data_tests: [unique, not_null]

  - name: stg_billing_core__plans
    columns:
      - name: plan_id
        data_tests: [unique, not_null]
      - name: billing_customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_billing_core__customers'), field: billing_customer_id}
      - name: plan_status
        data_tests:
          - accepted_values:
              arguments: {values: ["active", "cancelled"]}
      - name: mrr_eur
        data_tests: [not_null]

  - name: stg_billing_core__invoices
    columns:
      - name: invoice_id
        data_tests: [unique, not_null]
      - name: plan_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_billing_core__plans'), field: plan_id}
      - name: issued_local_date
        data_tests: [not_null]

  - name: stg_billing_core__crosswalk
    columns:
      - name: crosswalk_id
        data_tests: [unique, not_null]
      - name: entity_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}

  - name: stg_partner_biller__customers
    columns:
      - name: partner_customer_id
        data_tests: [unique, not_null]

  - name: stg_engagement_hub__contacts
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
      - name: entity_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}

  - name: stg_brr__run_rate
    columns:
      - name: brr_key
        data_tests: [unique, not_null]
      - name: brr_tier
        data_tests:
          - accepted_values:
              arguments: {values: ["Anchor", "Scale", "Standard", "Starter"]}
