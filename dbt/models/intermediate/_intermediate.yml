version: 2

models:
  - name: int_id_crosswalk
    description: Every entity resolved to its billing keys, with the link path that matched.
    columns:
      - name: crosswalk_row_id
        data_tests: [unique, not_null]
      - name: entity_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}
      - name: link_path
        data_tests:
          - accepted_values:
              arguments: {values: ["direct_ref", "comma_list", "crosswalk", "partner_biller", "unlinked"]}

  - name: int_run_rate_resolved
    columns:
      - name: entity_id
        data_tests: [unique, not_null]
      - name: resolution_outcome
        data_tests:
          - accepted_values:
              arguments: {values: ["naive_match", "resolved_via_billing_key", "partner_biller_no_brr"]}

  - name: int_attrition_events
    description: Entity grain. Contract clock, status clock, rebound and entity-transfer flags, both tiers, run-rate.
    columns:
      - name: entity_id
        data_tests: [unique, not_null]
      - name: holding_group_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_deal_ledger__entities'), field: entity_id}
      - name: dl_tier
        data_tests: [not_null]
      - name: clock_alignment
        data_tests:
          - accepted_values:
              arguments:
                values: ["no_departure", "rebound_no_contract_departure", "status_only", "status_lag_missing_flip",
                         "status_lag_late_flip", "status_lag_early_flip", "clock_year_shift", "aligned"]
