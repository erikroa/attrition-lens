name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: make generate

      - name: dbt build (models + tests)
        run: make dbt

      - name: Export Tableau CSVs
        run: make export

      - name: pytest
        run: make test

      - name: Headline bridge
        run: make headline
